name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Check format
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Race tests
        run: go test -race ./... -count=1 -timeout=180s
      - name: Vet
        run: go vet ./...
      - name: Vet Windows
        run: GOOS=windows go vet ./...
      - name: Vet macOS
        run: GOOS=darwin go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
      - name: Build
        run: go build -trimpath ./...
