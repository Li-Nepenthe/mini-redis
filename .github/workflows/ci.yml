name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Check format
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Race tests
        run: go test -race ./... -count=1 -timeout=180s
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
      - name: Build
        run: go build -trimpath ./...

  ai-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ai_backend
          MYSQL_ROOT_PASSWORD: ci-local-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -pci-local-test-only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_DSN: root:ci-local-test-only@tcp(127.0.0.1:3306)/ai_backend?parseTime=true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: ai-backend/go.sum
      - name: Check format
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Race and MySQL integration
        run: go test -race ./... -count=1 -timeout=180s
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
      - name: Build
        run: go build -trimpath ./...
